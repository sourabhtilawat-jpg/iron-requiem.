name: Build Iron Requiem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Use the runner's preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      - run: npm install
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          # immersive full screen (hide status/nav bars, use notch area), landscape, screen stays on
          node tools/android-fullscreen.cjs
      - name: Build APK (installable test build)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build AAB (for Google Play)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ../release.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/../release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: IronRequiem-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IronRequiem.apk
      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Iron Requiem — latest Android build
          body: Tap IronRequiem.apk below to download, then open it to install (allow installing from this source when Android asks).
          prerelease: true
          make_latest: false
          files: IronRequiem.apk

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with: { path: game }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: IronRequiem-Windows
          path: game/release/*.exe
      - name: Publish EXE as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Iron Requiem — latest Windows build
          prerelease: true
          make_latest: false
          files: game/release/*.exe
