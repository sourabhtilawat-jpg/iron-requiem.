name: Build Iron Requiem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          # landscape + fullscreen game activity
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/AppTheme.NoActionBarLaunch/AppTheme.NoActionBar/' android/app/src/main/AndroidManifest.xml || true
      - name: Build APK (installable test build)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build AAB (for Google Play)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ../release.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/../release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: IronRequiem-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: IronRequiem-Windows
          path: release/*.exe
